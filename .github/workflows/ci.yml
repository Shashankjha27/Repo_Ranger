name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-native:
    name: Test-native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:

        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --workspace --verbose

  test-containers:
    name: Test-containers (${{ matrix.distro.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: "Fedora Latest"
            image: "fedora:latest"
            prepare: "dnf -y update && dnf -y install gcc gcc-c++ git curl openssl-devel python3-devel cargo rust"
          - name: "Arch Latest"
            image: "archlinux:base-devel"
            prepare: "pacman -Sy --noconfirm archlinux-keyring && pacman -Syu --noconfirm rust cargo python git gcc clang"
    container:
      image: ${{ matrix.distro.image }}
  
    steps:
      - run: ${{ matrix.distro.prepare}}
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "*"
      - uses: actions/checkout@v4
      - run: cargo test --workspace --verbose

  pyo3-build:
    name: PyO3 Extension Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel with Maturin
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --manifest-path crates/repo_ranger_py/Cargo.toml --out dist
      - name: Install Wheel and Run Pytest
        run: |
          pip install dist/*.whl pytest httpx anyio
          PYTHONPATH=. pytest test/
